# dvc.yaml - Document Parser Pipeline Configuration
stages:
  extract_text:
    cmd: python src/extractors/text_extractor.py
    deps:
      - data/raw/10-K/
      - data/raw/10-Q/
      - src/extractors/text_extractor.py
    outs:
      - data/parsed/text/

  extract_tables:
    cmd: python src/extractors/table_extractor.py
    deps:
      - data/raw/10-K/
      - data/raw/10-Q/
      - src/extractors/table_extractor.py
    outs:
      - data/parsed/tables/

# Optional: Define parameters for experimentation
params:
  - src/params.yaml

# Optional: Define plots for visualization
plots:
  - data/parsed/text/processing_log.json:
      x: total_statistics.total_files
      y: total_statistics.ocr_percentage
  - data/parsed/tables/table_processing_log.json:
      x: total_statistics.total_files
      y: total_statistics.total_tables